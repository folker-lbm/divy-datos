# Experimentos de fuentes nuevas (FUENTES-GLOBALES.md): ejecuta un script de prueba con las credenciales y deja su
# salida como artefacto. No publica nada.
name: Experimento

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'script a ejecutar (p. ej. experimento_olci.py)'
        required: true
        default: experimento_olci.py

jobs:
  experimento:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Ejecutar
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          DIVY_FORECAST_TOKEN: ${{ secrets.DIVY_FORECAST_TOKEN }}
        run: python -I "${{ inputs.script }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experimento
          path: salida/
