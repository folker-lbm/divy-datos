# Control semanal de los productos de Copernicus que usa el proceso (vigilar_copernicus.py). Si a alguno le quedan
# menos de 60 días para retirarse sin sustituto, la ejecución falla y GitHub avisa por correo.
name: Vigilar Copernicus

on:
  schedule:
    - cron: '0 8 * * 1' # lunes a las 8:00 UTC
  workflow_dispatch:

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -I vigilar_copernicus.py
