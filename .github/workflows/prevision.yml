# Previsión marina automática de Divy. Ejecuta pipeline.py y publica el resultado en la API de Divy (producción y
# pruebas). Repositorio público para tener minutos de GitHub Actions sin límite; la app está en otro repositorio privado. Secretos del repositorio:
#   · COPERNICUSMARINE_SERVICE_USERNAME y COPERNICUSMARINE_SERVICE_PASSWORD: cuenta de Copernicus Marine (los pone Luka).
#   · DIVY_FORECAST_TOKEN: token de publicación (el mismo que FORECAST_TOKEN en los Workers).
#   · EARTHDATA_USERNAME y EARTHDATA_PASSWORD: cuenta gratuita de NASA Earthdata para PACE (opcional; sin ella se omite).
name: Previsión

on:
  schedule:
    # Lo más rápido posible sin pasar los límites gratuitos (Luka, 13 oct: fiabilidad y actualización rápida):
    - cron: '30 4,13 * * *' # completo (Copernicus + Open-Meteo) dos veces al día: recoge las nuevas salidas y recupera caídas
    - cron: '20 1,7,10,16,19,22 * * *' # solo Open-Meteo y avisos, cada 3 h (8 ejecuciones/día ≈ 8.300 llamadas de 10.000)
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo (Copernicus + Open-Meteo) u open-meteo (oleaje y viento)'
        type: choice
        options: [completo, open-meteo]
        default: completo
      forzar:
        description: 'generar aunque la previsión publicada sea reciente'
        type: boolean
        default: false
      pruebas:
        description: 'solo en pruebas (divy-staging): lee de allí los spots, p. ej. con el catálogo mundial, y publica solo allí'
        type: boolean
        default: false

# Nunca dos ejecuciones a la vez: la de Open-Meteo depende de la parte de Copernicus de la última completa.
concurrency:
  group: prevision
  cancel-in-progress: false

jobs:
  prevision:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Modo
        id: modo
        run: |
          if [ -n "${{ inputs.modo }}" ]; then echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT";
          elif [ "${{ github.event.schedule }}" = "30 4,13 * * *" ]; then echo "modo=completo" >> "$GITHUB_OUTPUT";
          else echo "modo=open-meteo" >> "$GITHUB_OUTPUT"; fi
      - name: Generar y publicar
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          DIVY_FORECAST_TOKEN: ${{ secrets.DIVY_FORECAST_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python -I pipeline.py --modo "${{ steps.modo.outputs.modo }}" ${{ inputs.forzar && '--forzar' || '' }} --publicar ${{ inputs.pruebas && 'https://divy-staging.divy-api.workers.dev' || 'https://joindivy.com https://divy-staging.divy-api.workers.dev' }}
      - name: Avisos del proceso
        if: always()
        run: python -I -c "import json; d=json.load(open('salida/prevision.json')); print('Avisos:', d['warnings'] or 'ninguno')" || true
