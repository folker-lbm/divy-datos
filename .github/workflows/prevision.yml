# Previsión marina automática de Divy. Ejecuta pipeline.py y publica el resultado en la API de Divy (producción y
# pruebas). Repositorio público para tener minutos de GitHub Actions sin límite; la app está en otro repositorio privado. Secretos del repositorio:
#   · COPERNICUSMARINE_SERVICE_USERNAME y COPERNICUSMARINE_SERVICE_PASSWORD: cuenta de Copernicus Marine (los pone Luka).
#   · DIVY_FORECAST_TOKEN: token de publicación (el mismo que FORECAST_TOKEN en los Workers).
#   · EARTHDATA_USERNAME y EARTHDATA_PASSWORD: cuenta gratuita de NASA Earthdata para PACE (opcional; sin ella se omite).
name: Previsión
# El título de cada ejecución lleva el modo (9 nov): el vigilante del Worker (api/src/salud.ts) da crítico en el acto si
# falla una completa, y aviso si falla una de oleaje y viento.
run-name: "Previsión ${{ inputs.modo || 'completo' }}${{ inputs.pruebas && ' (pruebas)' || '' }}"

on:
  # Sin «schedule» (15 oct): lo lanza solo el temporizador del Worker de Divy (api/src/cron.ts), que es puntual y avisa si
  # falla. Con los dos, las ejecuciones se duplicaban y, con el mundo (la completa tarda ~73 min), se pisaban en la cola.
  # Horario (15 oct, según la publicación de cada modelo): completo a las 4:10 y 16:45 UTC; oleaje, viento y avisos a la
  # 1:00, 7:00, 9:50, 13:00, 19:00 y 21:50.
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo (Copernicus + Open-Meteo) u open-meteo (oleaje y viento)'
        type: choice
        options: [completo, open-meteo]
        default: completo
      forzar:
        description: 'generar aunque la previsión publicada sea reciente'
        type: boolean
        default: false
      pruebas:
        description: 'solo en pruebas (divy-staging): lee de allí los spots, p. ej. con el catálogo mundial, y publica solo allí'
        type: boolean
        default: false
      marea:
        description: 'T124: marea de Copernicus sumada a la corriente global (solo con «pruebas»; en producción la enciende la variable DIVY_MAREA)'
        type: boolean
        default: false
      puente:
        description: 'Puente de la corriente: la global con la marea en los spots de Europa sin regional a 3 km (solo con «pruebas» y «marea»; en producción, la variable DIVY_CORRIENTE_LEJOS)'
        type: boolean
        default: false

# Nunca dos ejecuciones a la vez: la de Open-Meteo depende de la parte de Copernicus de la última completa. Las de
# pruebas van en su propia cola (3 nov): en la común, una pendiente de pruebas podía cancelar la pendiente de producción.
concurrency:
  group: ${{ inputs.pruebas && 'prevision-pruebas' || 'prevision' }}
  cancel-in-progress: false

jobs:
  prevision:
    # Previsión más fresca (15 oct): seis grupos de regiones a la vez, cada uno prepara y publica solo las suyas
    # (~80 min → ~20–25). El cupo de Open-Meteo fuera de España se reparte entre los grupos (5 × 200 ≤ 1.100).
    strategy:
      fail-fast: false
      matrix:
        grupo:
          - es
          - med
          - eu mrojo africa
          - filipinas sudeste
          - oceania norteamerica
          - caribe sudamerica
    name: prevision (${{ matrix.grupo }})
    # Fijado a 24.04 (8 nov): ubuntu-latest pasó a 26.04, que no tiene Python 3.9, y la completa de las 4:10 falló entera.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Modo
        id: modo
        run: |
          if [ -n "${{ inputs.modo }}" ]; then echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT";
          else echo "modo=open-meteo" >> "$GITHUB_OUTPUT"; fi
      - name: Generar y publicar
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          DIVY_FORECAST_TOKEN: ${{ secrets.DIVY_FORECAST_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
          # T124, marea fuera de Europa (arreglo 1 de T144, 12 nov). Interruptor: la variable del repositorio DIVY_MAREA.
          # Apagada (sin la variable), como hasta ahora: la marea solo en pruebas con la casilla «marea». Se enciende el
          # mismo día que se publique la app 1.2, con el OK de Luka: «gh variable set DIVY_MAREA --body 1 -R
          # folker-lbm/divy-datos» y una completa a mano (las de Open-Meteo reutilizan la parte de Copernicus de la última
          # completa). Se apaga con «gh variable delete DIVY_MAREA -R folker-lbm/divy-datos» y otra completa.
          DIVY_MAREA: ${{ ((inputs.pruebas && inputs.marea) || vars.DIVY_MAREA == '1') && '1' || '' }}
          DIVY_SUMAR_MAREA: ${{ ((inputs.pruebas && inputs.marea) || vars.DIVY_MAREA == '1') && '1' || '' }}
          # T149: la corriente de marea de STOFS-2D-Global (marea_stofs.py) en lugar de la de Copernicus en los spots con
          # constantes buenas. Interruptor: la variable del repositorio DIVY_MAREA_FUENTE («stofs»). Se enciende con
          # «gh variable set DIVY_MAREA_FUENTE --body stofs -R folker-lbm/divy-datos» y una completa a mano; se apaga con
          # «gh variable delete DIVY_MAREA_FUENTE -R folker-lbm/divy-datos» y otra completa (ver INFORME de T149).
          DIVY_MAREA_FUENTE: ${{ vars.DIVY_MAREA_FUENTE }}
          # T127 (21 nov): viento de todo el mundo con ECMWF Open Data a 0,1°, salvo los spots de costa abrigada de
          # datos/ecmwf01-abrigados.json (ecmwf01.py). Interruptor: la variable del repositorio DIVY_ECMWF01. Se enciende, con
          # el OK de Luka, con «gh variable set DIVY_ECMWF01 --body 1 -R folker-lbm/divy-datos» y se apaga con «gh variable
          # delete DIVY_ECMWF01 -R folker-lbm/divy-datos»; vale desde la ejecución siguiente. El oleaje de ECMWF va aparte,
          # con DIVY_ECMWF01_OLAS («respaldo» o «todo»), y no está aprobado (Luka, 21 nov).
          DIVY_ECMWF01: ${{ vars.DIVY_ECMWF01 }}
          DIVY_ECMWF01_OLAS: ${{ vars.DIVY_ECMWF01_OLAS }}
          # Puente de la corriente (23 nov, sin aprobar): la corriente global para los spots de Europa cuya celda regional queda
          # a más de 3 km (pipeline.py, CORRIENTE_LEJOS); solo hace algo con la marea encendida. En pruebas, la casilla «puente». Interruptor: la variable del repositorio DIVY_CORRIENTE_LEJOS. Se
          # enciende, con el OK de Luka, con «gh variable set DIVY_CORRIENTE_LEJOS --body 1 -R folker-lbm/divy-datos» y una
          # completa; se apaga con «gh variable delete DIVY_CORRIENTE_LEJOS -R folker-lbm/divy-datos» y otra completa.
          DIVY_CORRIENTE_LEJOS: ${{ ((inputs.pruebas && inputs.puente) || vars.DIVY_CORRIENTE_LEJOS == '1') && '1' || '' }}
          # Respaldo de la corriente (23 nov, sin aprobar): Open-Meteo para los spots sin corriente usable por la app
          # (pipeline.py, RESPALDO_LEJOS). Variable del repositorio DIVY_RESPALDO_LEJOS; en pruebas, con la casilla «puente».
          # Se enciende con «gh variable set DIVY_RESPALDO_LEJOS --body 1 -R folker-lbm/divy-datos» y se apaga con «gh
          # variable delete DIVY_RESPALDO_LEJOS -R folker-lbm/divy-datos»; vale desde la ejecución siguiente.
          DIVY_RESPALDO_LEJOS: ${{ ((inputs.pruebas && inputs.puente) || vars.DIVY_RESPALDO_LEJOS == '1') && '1' || '' }}
        run: python -I pipeline.py --modo "${{ steps.modo.outputs.modo }}" --regiones ${{ matrix.grupo }} --cupo-om 200 ${{ inputs.forzar && '--forzar' || '' }} --publicar ${{ inputs.pruebas && 'https://divy-staging.divy-api.workers.dev' || 'https://joindivy.com https://divy-staging.divy-api.workers.dev' }}
      - name: Avisos del proceso
        if: always()
        run: python -I -c "import glob, json; [print(f, 'Avisos:', json.load(open(f))['warnings'] or 'ninguno') for f in sorted(glob.glob('salida/prevision*.json'))]" || true
