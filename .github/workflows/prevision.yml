# Previsión marina automática de Divy. Ejecuta pipeline.py y publica el resultado en la API de Divy (producción y
# pruebas). Repositorio público para tener minutos de GitHub Actions sin límite; la app está en otro repositorio privado. Secretos del repositorio:
#   · COPERNICUSMARINE_SERVICE_USERNAME y COPERNICUSMARINE_SERVICE_PASSWORD: cuenta de Copernicus Marine (los pone Luka).
#   · DIVY_FORECAST_TOKEN: token de publicación (el mismo que FORECAST_TOKEN en los Workers).
#   · EARTHDATA_USERNAME y EARTHDATA_PASSWORD: cuenta gratuita de NASA Earthdata para PACE (opcional; sin ella se omite).
name: Previsión

on:
  # Sin «schedule» (15 oct): lo lanza solo el temporizador del Worker de Divy (api/src/cron.ts), que es puntual y avisa si
  # falla. Con los dos, las ejecuciones se duplicaban y, con el mundo (la completa tarda ~73 min), se pisaban en la cola.
  # Horario: completo a las 4:30 y 13:30 UTC; oleaje, viento y avisos a las 1:20, 7:20, 10:20, 16:20, 19:20 y 22:20.
  workflow_dispatch:
    inputs:
      modo:
        description: 'completo (Copernicus + Open-Meteo) u open-meteo (oleaje y viento)'
        type: choice
        options: [completo, open-meteo]
        default: completo
      forzar:
        description: 'generar aunque la previsión publicada sea reciente'
        type: boolean
        default: false
      pruebas:
        description: 'solo en pruebas (divy-staging): lee de allí los spots, p. ej. con el catálogo mundial, y publica solo allí'
        type: boolean
        default: false

# Nunca dos ejecuciones a la vez: la de Open-Meteo depende de la parte de Copernicus de la última completa.
concurrency:
  group: prevision
  cancel-in-progress: false

jobs:
  prevision:
    # Previsión más fresca (15 oct): seis grupos de regiones a la vez, cada uno prepara y publica solo las suyas
    # (~80 min → ~20–25). El cupo de Open-Meteo fuera de España se reparte entre los grupos (5 × 200 ≤ 1.100).
    strategy:
      fail-fast: false
      matrix:
        grupo:
          - es
          - med
          - eu mrojo africa
          - filipinas sudeste
          - oceania norteamerica
          - caribe sudamerica
    name: prevision (${{ matrix.grupo }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Modo
        id: modo
        run: |
          if [ -n "${{ inputs.modo }}" ]; then echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT";
          else echo "modo=open-meteo" >> "$GITHUB_OUTPUT"; fi
      - name: Generar y publicar
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
          DIVY_FORECAST_TOKEN: ${{ secrets.DIVY_FORECAST_TOKEN }}
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python -I pipeline.py --modo "${{ steps.modo.outputs.modo }}" --regiones ${{ matrix.grupo }} --cupo-om 200 ${{ inputs.forzar && '--forzar' || '' }} --publicar ${{ inputs.pruebas && 'https://divy-staging.divy-api.workers.dev' || 'https://joindivy.com https://divy-staging.divy-api.workers.dev' }}
      - name: Avisos del proceso
        if: always()
        run: python -I -c "import glob, json; [print(f, 'Avisos:', json.load(open(f))['warnings'] or 'ninguno') for f in sorted(glob.glob('salida/prevision*.json'))]" || true
